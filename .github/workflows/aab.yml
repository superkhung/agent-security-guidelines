name: aab

on:
  push:
    branches: [main]
    paths:
      - "companion-spec/**"
      - ".github/workflows/aab.yml"
  pull_request:
    paths:
      - "companion-spec/**"
      - ".github/workflows/aab.yml"

permissions:
  contents: read

jobs:
  vectors:
    name: reference implementation and vectors (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cryptography, stdlib]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the signature backend
        if: matrix.backend == 'cryptography'
        run: python -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Unit tests
        run: python -m unittest discover -s companion-spec/reference/python/tests
      - name: Test vectors
        run: python companion-spec/vectors/run.py
