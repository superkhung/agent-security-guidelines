# Egress proxy for the agent sandbox (NET-01). Only CONNECT to port 443 of an
# allowlisted domain is allowed; everything else is denied and logged.
http_port 3128

acl allowlist dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowlist
http_access deny all

# Every decision is logged: docker compose exec proxy tail -f /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log
cache deny all
